load_eval_trajs_path: ${datasets}/eval_trajs/fourroom/fourroom_tp35_cross2_goal75_n50_d1.pt
world:
  env_name: swm/FourRoomDistractors-v0
  num_envs: 1
  agent_speed: 2.5
  agent_radius: 3.5
  wall_thickness: 10
  door_size: [16, 16, 16, 16]
  door_positions: {top: 56, bottom: 168, left: 56, right: 168}
  close_door_prob: 0.5
  target_min_steps: null
  min_distractors: 0
  max_distractors: 5
  distractor_speed: 2.5
  distractor_policy: explore
  distractor_action_noise: 0.0
  distractor_explore:
    speed_noise_std: 0.0
    turn_autocorr: 0.0
    turn_noise_std: 0.0
    target_heading_gain: 0.0
    switch_tau: null
    switch_mode: periodic
    teleport_tau: 35
    teleport_mode: poisson
    initial_turn_rate_std: 0.0
  history_size: 1
  frame_skip: 1
eval:
  num_eval: 50
  eval_budget: 210
  img_size: 224
  callables:
    - method: _set_state
      args:
        state: {value: state}
    - method: _set_goal_state
      args:
        goal_state: {value: goal_xy}
    - method: _set_distractor_positions
      args:
        distractor_xy: {value: distractor_xy}
