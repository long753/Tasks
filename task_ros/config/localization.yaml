map_server:
  ros__parameters:
    use_sim_time: true
    frame_id: map
    # yaml_filename 由 localization.launch.py 的 map 参数提供。

amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.10
    laser_max_range: 12.0
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    # 低速驾驶时也及时用激光校正轮式里程计，单位为 m 和 rad。
    update_min_d: 0.05
    update_min_a: 0.05
    transform_tolerance: 0.3
    tf_broadcast: true
    # 初始 XY 和 yaw 由 launch 从场景 start_marker 读取，仅在启动时使用。
    set_initial_pose: true
