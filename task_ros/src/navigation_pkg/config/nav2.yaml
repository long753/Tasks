/**:
  ros__parameters:
    # 所有 Nav2 节点使用 Gazebo 仿真时钟。
    use_sim_time: true

map_server:
  ros__parameters:
    frame_id: map
    # 地图路径由 launch 的 map 参数提供。

amcl:
  ros__parameters:
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /scan
    laser_min_range: 0.10
    laser_max_range: 12.0
    # 低速行驶时也及时进行激光校正。
    update_min_d: 0.05
    update_min_a: 0.05
    transform_tolerance: 0.3
    tf_broadcast: true
    # launch 从工位起点标记读取初始位姿。
    set_initial_pose: true

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      use_astar: true
      allow_unknown: false
      tolerance: 0.0

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      track_unknown_space: true
      robot_radius: 0.3
      footprint_padding: 0.0
      resolution: 0.1
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /planning_map
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.7
        cost_scaling_factor: 2.0

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    publish_zero_velocity: true
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      # 原地旋转也视为取得进展。
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.10
      required_movement_angle: 0.20
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.10

    FollowPath:
      # 先对齐路径，避免差速底盘贴墙。
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      angular_dist_threshold: 0.35
      angular_disengage_threshold: 0.20
      forward_sampling_distance: 0.50
      rotate_to_heading_angular_vel: 0.50
      max_angular_accel: 0.80
      simulate_ahead_time: 0.5
      # DWA 仅采样下一控制周期内可达的速度。
      trajectory_generator_name: "dwb_plugins::LimitedAccelGenerator"
      sim_period: 0.05
      publish_local_plan: true
      publish_trajectories: false
      publish_evaluation: false
      publish_global_plan: false
      publish_transformed_plan: false
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 2.0
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.20
      min_speed_theta: 0.0
      acc_lim_x: 0.80
      acc_lim_y: 0.0
      acc_lim_theta: 0.80
      decel_lim_x: -0.80
      decel_lim_y: 0.0
      decel_lim_theta: -0.80
      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 25
      # 预测时长；下方 granularity 控制轨迹离散步长。
      sim_time: 2.0
      linear_granularity: 0.025
      angular_granularity: 0.025
      transform_tolerance: 0.20
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.05
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "PreferForward", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.20
      # 碰撞轨迹直接淘汰；前进偏好参与加权评分，不只是同分时生效。
      PreferForward.scale: 5.0
      PreferForward.strafe_x: 0.01
      PreferForward.strafe_theta: 0.20
      PreferForward.theta_scale: 1.0
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.40
      GoalAlign.scale: 16.0
      GoalAlign.forward_point_distance: 0.40
      PathDist.scale: 24.0
      GoalDist.scale: 18.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      # 使用 map，避免窄通道被 TF 旋转重采样封死。
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      transform_tolerance: 0.20
      track_unknown_space: false
      robot_radius: 0.3
      footprint_padding: 0.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /planning_map
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_min_range: 0.10
          obstacle_max_range: 12.0
          raytrace_min_range: 0.10
          raytrace_max_range: 12.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
