controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 250
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: forward_command_controller/ForwardCommandController

arm_controller:
  ros__parameters:
    joints:
      - arm_joint_1
      - arm_joint_2
      - arm_joint_3
      - arm_joint_4
      - arm_joint_5
      - arm_joint_6
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05
      arm_joint_1: {goal: 0.015}
      arm_joint_2: {goal: 0.015}
      arm_joint_3: {goal: 0.015}
      arm_joint_4: {goal: 0.015}
      arm_joint_5: {goal: 0.015}
      arm_joint_6: {goal: 0.015}

gripper_controller:
  ros__parameters:
    joints: [left_finger_joint, right_finger_joint]
    interface_name: effort
