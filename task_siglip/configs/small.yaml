name: siglip-small
model:
  image_size: 224
  patch_size: 16
  max_text_length: 64

  # init prameters
  init_logit_scale: 2.3
  init_logit_bias: -10.0

  # vision encoder configuration
  vision:
    hidden_size: 384
    num_hidden_layers: 12
    num_attention_heads: 6
    intermediate_size: 1536

  # text encoder configuration
  text:
    hidden_size: 384
    num_hidden_layers: 6
    num_attention_heads: 6
    intermediate_size: 1536
    projection_size: 384
