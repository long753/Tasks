[project]
name = "siglip-from-scratch"
version = "0.1.0"
description = "Educational SigLIP-Tiny and SigLIP-Small from-scratch pretraining"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
  "transformers>=4.56,<5",
  "datasets>=3,<5",
  "pillow>=10",
  "pyyaml>=6",
  "tqdm>=4.66",
  "sentencepiece>=0.2.2",
  "protobuf>=7.36.2",
  "safetensors>=0.8.0",
  "tensorboard>=2.21.0",
  "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# ==================== Ruff ====================

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
# I: Import 排序
# UP: 现代 Python 语法检查
# 同时保留 Ruff 默认检查规则
extend-select = ["I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
# 允许 __init__.py 中存在用于对外导出的 Import
"__init__.py" = ["F401"]


# ==================== ty ====================

# 针对 PyTorch 模型和训练代码放宽特定规则
[[tool.ty.overrides]]
include = ["src", "scripts"]

[tool.ty.overrides.rules]

# PyTorch nn.Module.forward 的可写属性覆盖兼容问题
invalid-mutable-override = "ignore"
